<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E3440" />
    <title>SF Muni - N or J</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest?v=2" />
  </head>

  <body>
    <div class="app">
      <header class="mark">
        <img src="./images/apple-touch-icon.png" alt="N or J" />
      </header>

      <ul class="board" id="arrivals-list" aria-live="polite">
        Loading arrivals...
      </ul>

      <footer class="controls">
        <div class="stamp">
          <span class="status-dot" id="api-key-status"></span>
          <span id="last-updated">Never updated</span>
        </div>
        <button class="update" id="api-refresh-btn">Update</button>
        <button class="keybtn" id="key-btn" aria-label="API key settings">
          Key
        </button>
      </footer>
    </div>

    <dialog class="key-dialog" id="key-dialog">
      <form method="dialog" class="key-dialog__body">
        <h2>511.org API key</h2>
        <p class="key-dialog__hint">
          Stored on this device only. Without a key the app falls back to the
          cached data published by GitHub Actions.
        </p>
        <input
          type="password"
          class="key-dialog__input"
          id="api-key-input"
          placeholder="Paste your API key"
          autocomplete="off"
        />
        <div class="key-dialog__actions">
          <button
            value="cancel"
            class="key-dialog__btn key-dialog__btn--ghost"
            formnovalidate
          >
            Cancel
          </button>
          <button
            value="remove"
            class="key-dialog__btn key-dialog__btn--danger"
            id="remove-api-key"
          >
            Remove
          </button>
          <button
            value="save"
            class="key-dialog__btn key-dialog__btn--primary"
            id="save-api-key"
          >
            Save
          </button>
        </div>
      </form>
    </dialog>

    <script src="./js/app.js"></script>
  </body>
</html>
