<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b26" />
    <title>SF Muni - N or J</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest?v=2" />
  </head>

  <body>
    <main>
      <div class="image">
        <img src="./images/apple-touch-icon.png" alt="SF Muni - N or J" />
      </div>

      <section id="trains">
        <h2>Upcoming Buses</h2>
        <div id="mode-label"></div>
        <ul id="arrivals-list">
          Loading arrivals...
        </ul>
      </section>

      <section id="controls">
        <div id="last-updated">Last Updated: Never</div>
        <button id="api-refresh-btn">Update</button>
      </section>

      <section id="api-key">
        <input
          type="password"
          id="api-key-input"
          placeholder="Enter your 511.org API Key"
        />
        <button id="save-api-key">Save API Key</button>
        <div class="status-container">
          <div id="api-key-status"></div>
          <button id="remove-api-key" hidden>Remove API Key</button>
        </div>
      </section>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
