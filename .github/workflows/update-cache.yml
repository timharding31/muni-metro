name: Update Muni Data Cache

on:
  schedule:
    # Weekday commute windows, Pacific Time. Cron is UTC; these assume PDT (UTC-7),
    # so they run an hour early during PST. Adjust if needed.
    - cron: '*/5 15-18 * * 1-5'        # 8am-11:59am PT — inbound
    - cron: '*/5 23,0,1,2,3 * * 1-5'   # 4pm-8:59pm PT — outbound
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: 'gh-pages'  # Use the gh-pages branch
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Fetch latest Muni data
        run: |
          mkdir -p data
           
          # Inbound: 12 from Pacific Ave & Polk St (15851)
          curl -s -H "Accept-Encoding: gzip, deflate" --compressed "https://api.511.org/transit/StopMonitoring?api_key=${{ secrets.API_KEY }}&agency=SF&stopCode=15851&format=json" > data/stop-15851.json || echo "Failed to fetch 12 inbound data"
           
          # Inbound: 1 from Clay St & Polk St (14026)
          curl -s -H "Accept-Encoding: gzip, deflate" --compressed "https://api.511.org/transit/StopMonitoring?api_key=${{ secrets.API_KEY }}&agency=SF&stopCode=14026&format=json" > data/stop-14026.json || echo "Failed to fetch 1 inbound data"
           
          # Outbound: 12 and 1 from Sacramento St & Battery St (16290)
          curl -s -H "Accept-Encoding: gzip, deflate" --compressed "https://api.511.org/transit/StopMonitoring?api_key=${{ secrets.API_KEY }}&agency=SF&stopCode=16290&format=json" > data/stop-16290.json || echo "Failed to fetch outbound data"
           
          # Create metadata file with timestamp
          echo "{\"lastUpdated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/metadata.json
           
          # Verify JSON is valid
          echo "Validating 12 inbound data..."
          cat data/stop-15851.json | jq . > /dev/null || echo "Warning: 12 inbound data is not valid JSON"
           
          echo "Validating 1 inbound data..."
          cat data/stop-14026.json | jq . > /dev/null || echo "Warning: 1 inbound data is not valid JSON"

          echo "Validating outbound data..."
          cat data/stop-16290.json | jq . > /dev/null || echo "Warning: outbound data is not valid JSON"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/
          git commit -m "Update Muni data cache" || echo "No changes to commit"
          git push || echo "Failed to push changes"
